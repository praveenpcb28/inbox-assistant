<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="inner-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="#020617" />
  
  <!-- Subtle Gradient Accent Card -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#brand-grad)" />
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#inner-shadow)" />

  <!-- Shield and Mail Graphics -->
  <g transform="translate(96, 96)">
    <!-- Stylized Mailbox Envelope Base -->
    <rect x="20" y="70" width="280" height="190" rx="24" fill="#ffffff" fill-opacity="0.96" />
    <path d="M24 86 L160 186 L296 86" stroke="#4338ca" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M24 246 L118 156" stroke="#c7d2fe" stroke-width="14" stroke-linecap="round" />
    <path d="M296 246 L202 156" stroke="#c7d2fe" stroke-width="14" stroke-linecap="round" />

    <!-- AI Sparkle / Star Emblem -->
    <path d="M260 20 L272 56 L308 68 L272 80 L260 116 L248 80 L212 68 L248 56 Z" fill="#fbbf24" />
    <circle cx="260" cy="68" r="6" fill="#fef3c7" />

    <!-- Human Verification Shield Badge -->
    <g transform="translate(196, 150)">
      <circle cx="50" cy="50" r="44" fill="#10b981" />
      <circle cx="50" cy="50" r="38" fill="#047857" />
      <path d="M35 50 L45 60 L66 38" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
